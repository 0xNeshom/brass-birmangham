-capital-calder-feeder: rail-coal-feeder-3 above river-calder-2.</text><text x="45" y="1630" class="small">B7 bridge-capital-weaver-southern: rail-southern-arc-4 above river-weaver-3.</text><text x="45" y="1655" class="small">B8 bridge-westford-canal-southern: rail-southern-arc-1 above canal-weaver-1.</text><text x="45" y="1680" class="small">B9 bridge-capital-canal-southern: rail-southern-arc-4 above canal-weaver-2.</text></svg>