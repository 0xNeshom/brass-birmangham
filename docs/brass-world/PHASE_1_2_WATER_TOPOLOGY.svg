<text x="42" y="1363" font-size="20">Interfaces, locks and transfer semantics</text>
<text x="55" y="1395" class="small">lock-weaver-flight · canal-weaver-01 · Below Millbrook millpond reach, before Westford</text>
<text x="55" y="1422" class="small">lock-foundry-flight · canal-southern-02 · Between Foundry Vale upper pound and capital basin</text>
<text x="55" y="1449" class="small">lock-greyhaven-control · canal-lower-calder-02 · Immediately east of Greyhaven warehouse basin</text>
<text x="55" y="1476" class="small">lock-rivermouth-sea · canal-lower-calder · Between sheltered dock basin and tidal inlet</text>
<text x="55" y="1503" class="small">lock-ironhaven-river · canal interface · Proposed basin outlet to the Calder at the Weaver–Calder confluence node; whether the lock should sit on this node or immediately downstream remains unresolved for owner review.</text>
<text x="42" y="1525" class="small">Rail/canal freight handling is registered separately; river proximity does not create navigation links.</text>
<text x="42" y="1554" class="small">Coordinates remain provisional. Shared endpoint node IDs represent logical continuity; no proximity-derived links.</text>
